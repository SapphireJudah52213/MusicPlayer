<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Shuffle Music Player</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="player">

	<div class="title">
		Shuffle Music Player
	</div>

	<label class="drop-area" id="dropArea">
		Drop music files here or click to upload
		<input 
			type="file" 
			id="fileInput" 
			accept="audio/*" 
			multiple
		>
	</label>

	<div class="album-art" id="albumArt">
	🎧
</div>

	<div class="song-name" id="songName">
		No song selected
	</div>

	<audio id="audio"></audio>

	<div class="progress-container">
		<input 
			type="range" 
			id="progress" 
			value="0" 
			min="0" 
			max="100"
		>

		<div class="time">
			<span id="currentTime">0:00</span>
			<span id="duration">0:00</span>
		</div>
	</div>


	<div class="controls">

		<button id="previous">
			⏮
		</button>

		<button id="play" class="play">
			▶
		</button>

		<button id="next">
			⏭
		</button>

	</div>


	<div class="volume">
		🔊
		<input 
			type="range" 
			id="volume" 
			min="0" 
			max="1" 
			step="0.01" 
			value="1"
		>
	</div>


	<button class="shuffle" id="shuffle">
		🔀 Shuffle Playlist
	</button>


	<div class="playlist">

		<h2>
			Playlist
		</h2>

		<div id="playlist"></div>

	</div>

</div>


<script type="module" src="script.js"></script>

</body>
</html>
